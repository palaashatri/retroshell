name: Remove private future plan

on:
  push:
    branches:
      - docs/program-design
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: remove-private-future-plan
  cancel-in-progress: false

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: docs/program-design
          fetch-depth: 0

      - name: Apply guarded documentation cleanup
        run: python3 scripts/remove-private-future-plan.py

      - name: Validate document scope
        run: |
          git diff --check
          test -n "$(git status --porcelain -- AGENTS.md TRUTH.md)"
          ! grep -R -n -E 'SLOPOS-II|SLOPOS-kernel|SLOPOS kernel|custom kernel' AGENTS.md TRUTH.md README.md
          git diff --exit-code -- README.md Cargo.toml Cargo.lock

      - name: Commit and remove one-shot machinery
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add AGENTS.md TRUTH.md
          git rm scripts/remove-private-future-plan.py
          git rm .github/workflows/remove-private-future-plan.yml
          git commit -m "docs: remove private future-kernel planning"
          git fetch origin docs/program-design
          git rebase origin/docs/program-design
          git push origin HEAD:docs/program-design
