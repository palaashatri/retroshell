name: CI

# The compositor is Linux-only: on macOS/Windows crates/slopos-compositor
# compiles down to a stub main() that prints "Linux-only". That is exactly how
# a borrow-checker error in the real implementation went unnoticed from
# 2026-07-11 to 2026-07-26 while ~30 commits claimed the compositor was "live".
# This workflow exists so that cannot happen again: the workspace must build on
# Linux for every push and pull request.

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  # Fail fast on a machine with limited RAM rather than OOM-killing rustc.
  CARGO_NET_RETRY: 3
  RUST_BACKTRACE: 1

jobs:
  linux:
    name: build + test (linux)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential pkg-config \
            libwayland-dev libwayland-egl-backend-dev \
            libvulkan-dev libegl1-mesa-dev libgles2-mesa-dev \
            libxkbcommon-dev libdbus-1-dev \
            libfontconfig-dev libfreetype6-dev \
            libdrm-dev libgbm-dev \
            libxcb1-dev libxcb-icccm4-dev libxcb-keysyms1-dev \
            libxcb-randr0-dev libxcb-util0-dev libxcb-xfixes0-dev \
            libinput-dev libudev-dev libseat-dev libsystemd-dev \
            libpipewire-0.3-dev libspa-0.2-dev

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - uses: Swatinem/rust-cache@v2

      # --all-targets so tests, benches and examples are type-checked too —
      # a test-only compile error is still a broken tree.
      - name: Build workspace
        run: cargo build --workspace --all-targets --locked

      - name: Test workspace
        run: cargo test --workspace --locked

      # Not -D warnings yet: the tree carries pre-existing warnings and turning
      # them into errors now would make CI red for reasons unrelated to the
      # change under review. This still fails on genuine clippy errors.
      # TODO: clear the backlog, then add `-- -D warnings`.
      - name: Clippy
        run: cargo clippy --workspace --all-targets --locked

  release-build:
    name: release build (linux)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential pkg-config \
            libwayland-dev libwayland-egl-backend-dev \
            libvulkan-dev libegl1-mesa-dev libgles2-mesa-dev \
            libxkbcommon-dev libdbus-1-dev \
            libfontconfig-dev libfreetype6-dev \
            libdrm-dev libgbm-dev \
            libxcb1-dev libxcb-icccm4-dev libxcb-keysyms1-dev \
            libxcb-randr0-dev libxcb-util0-dev libxcb-xfixes0-dev \
            libinput-dev libudev-dev libseat-dev libsystemd-dev \
            libpipewire-0.3-dev libspa-0.2-dev

      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      # The release profile is what packaging/vm and scripts/start-slopos-i
      # actually install, so it gets its own gate.
      - name: Build release binaries
        run: cargo build --workspace --release --locked

  formatting:
    name: rustfmt
    runs-on: ubuntu-latest
    # Informational for now: the tree is not fully rustfmt-clean. Flip
    # continue-on-error off once `cargo fmt --all` has been run and reviewed.
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --all --check
