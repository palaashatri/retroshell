name: Apply runtime output topology

on:
  push:
    branches:
      - docs/program-design
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: apply-runtime-output-topology
  cancel-in-progress: false

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Confirm exact trigger is still branch head
        run: |
          test "$(git rev-parse HEAD)" = "${{ github.sha }}"
          git fetch origin docs/program-design
          test "$(git rev-parse origin/docs/program-design)" = "${{ github.sha }}"

      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential pkg-config wayland-utils \
            libwayland-dev libwayland-egl-backend-dev \
            libvulkan-dev libegl1-mesa-dev libgles2-mesa-dev \
            libxkbcommon-dev libdbus-1-dev \
            libfontconfig-dev libfreetype6-dev \
            libdrm-dev libgbm-dev \
            libxcb1-dev libxcb-icccm4-dev libxcb-keysyms1-dev \
            libxcb-randr0-dev libxcb-util0-dev libxcb-xfixes0-dev \
            libinput-dev libudev-dev libseat-dev libsystemd-dev \
            libpipewire-0.3-dev libspa-0.2-dev

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: runtime-output-topology

      - name: Apply guarded implementation
        run: python3 scripts/apply-runtime-output-topology.py apply

      - name: Apply validation fixes
        run: |
          python3 - <<'PY'
          from pathlib import Path

          output_policy = Path("crates/slopos-compositor/src/output_assignment.rs")
          text = output_policy.read_text(encoding="utf-8")
          old = '''use crate::{
              normalize_laid_out_outputs, parse_outputs_layout_spec, LaidOutOutput, WindowGeometry,
          };
          '''
          new = '''use crate::{parse_outputs_layout_spec, LaidOutOutput, WindowGeometry};
          '''
          if text.count(old) != 1:
              raise SystemExit(
                  f"expected one duplicate normalize import, found {text.count(old)}"
              )
          output_policy.write_text(text.replace(old, new, 1), encoding="utf-8")

          drm = Path("crates/slopos-compositor/src/session_drm.rs")
          text = drm.read_text(encoding="utf-8")
          marker = "            SessionControlRequest::FocusedApplicationMenu {"
          insertion = '''            SessionControlRequest::ReconfigureOutputs { layout } => {
                      tracing::warn!(
                          %layout,
                          "runtime logical-output control is not the DRM connector-hotplug authority"
                      );
                  }
          '''
          if text.count(marker) != 1:
              raise SystemExit(
                  f"expected one DRM session-control insertion point, found {text.count(marker)}"
              )
          drm.write_text(text.replace(marker, insertion + marker, 1), encoding="utf-8")
          PY

      - name: Format and regenerate lockfile
        run: |
          chmod +x scripts/verify-compositor-output-topology-runtime.sh
          cargo fmt --all
          cargo generate-lockfile
          git diff --check

      - name: Build and test workspace
        run: |
          cargo build --workspace --all-targets --locked
          cargo test --workspace --locked
          cargo clippy --workspace --all-targets --locked

      - name: Commit implementation
        id: implementation
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add Cargo.lock \
            .github/workflows/ci.yml \
            crates/slopos-bus/src/session_control.rs \
            crates/slopos-compositor/src/lib.rs \
            crates/slopos-compositor/src/main.rs \
            crates/slopos-compositor/src/output_assignment.rs \
            crates/slopos-compositor/src/session_drm.rs \
            scripts/verify-compositor-completion.sh \
            scripts/verify-compositor-output-topology-runtime.sh
          git commit -m "feat(compositor): reconcile output topology at runtime"
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Run exact-commit compositor gates
        run: |
          test -z "$(git status --porcelain --untracked-files=no)"
          bash scripts/verify-compositor-completion.sh
          bash scripts/verify-compositor-headless-runtime.sh
          bash scripts/verify-compositor-output-topology-runtime.sh

      - name: Record verified truth and remove one-shot machinery
        run: |
          python3 scripts/apply-runtime-output-topology.py truth \
            "${{ steps.implementation.outputs.sha }}" \
            "${{ github.run_id }}"
          python3 - <<'PY'
          from pathlib import Path
          path = Path("TRUTH.md")
          lines = path.read_text(encoding="utf-8").splitlines()
          path.write_text("\n".join(line.rstrip() for line in lines) + "\n", encoding="utf-8")
          PY
          ! grep -R -n -E 'SLOPOS-II|SLOPOS-kernel|SLOPOS kernel|custom kernel' README.md AGENTS.md TRUTH.md
          git rm scripts/apply-runtime-output-topology.py
          git rm .github/workflows/apply-runtime-output-topology.yml
          git add TRUTH.md
          git diff --check --cached
          git commit -m "docs: record runtime output topology milestone"

      - name: Push verified commits
        run: |
          git fetch origin docs/program-design
          remote_head="$(git rev-parse origin/docs/program-design)"
          if [ "$remote_head" != "${{ github.sha }}" ]; then
            printf 'branch advanced during exact-commit verification: expected %s, found %s\n' \
              "${{ github.sha }}" "$remote_head" >&2
            exit 1
          fi
          git push origin HEAD:docs/program-design
