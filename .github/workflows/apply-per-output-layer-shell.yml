name: Apply per-output layer shell

on:
  push:
    branches:
      - docs/program-design
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: apply-per-output-layer-shell
  cancel-in-progress: false

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: docs/program-design
          fetch-depth: 0

      - name: Confirm current branch head
        run: |
          git fetch origin docs/program-design
          test "$(git rev-parse HEAD)" = "$(git rev-parse origin/docs/program-design)"

      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential pkg-config wayland-utils \
            libwayland-dev libwayland-egl-backend-dev \
            libvulkan-dev libegl1-mesa-dev libgles2-mesa-dev \
            libxkbcommon-dev libdbus-1-dev \
            libfontconfig-dev libfreetype6-dev \
            libdrm-dev libgbm-dev \
            libxcb1-dev libxcb-icccm4-dev libxcb-keysyms1-dev \
            libxcb-randr0-dev libxcb-util0-dev libxcb-xfixes0-dev \
            libinput-dev libudev-dev libseat-dev libsystemd-dev \
            libpipewire-0.3-dev libspa-0.2-dev

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: per-output-layer-shell

      - name: Apply guarded implementation
        run: python3 scripts/apply-per-output-layer-shell.py apply

      - name: Verify source migration
        run: |
          ! grep -q 'fn work_area_for_output(&self' crates/slopos-compositor/src/main.rs
          ! grep -q '_output: Option<.*WlOutput' crates/slopos-compositor/src/main.rs
          grep -q 'Output::from_resource' crates/slopos-compositor/src/main.rs
          grep -q 'output_index: usize' crates/slopos-compositor/src/main.rs
          grep -q 'intersecting_output_indices' crates/slopos-compositor/src/output_assignment.rs

      - name: Format and regenerate lockfile
        run: |
          cargo fmt --all
          cargo generate-lockfile
          git diff --check

      - name: Build and test workspace
        run: |
          cargo build --workspace --all-targets --locked
          cargo test --workspace --locked
          cargo clippy --workspace --all-targets --locked

      - name: Commit implementation
        id: implementation
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add Cargo.lock \
            crates/slopos-compositor/src/lib.rs \
            crates/slopos-compositor/src/main.rs \
            crates/slopos-compositor/src/output_assignment.rs \
            scripts/verify-compositor-completion.sh
          git commit -m "fix(compositor): own layer surfaces per output"
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Run exact-commit compositor gates
        run: |
          test -z "$(git status --porcelain --untracked-files=no)"
          bash scripts/verify-compositor-completion.sh
          bash scripts/verify-compositor-headless-runtime.sh

      - name: Record verified truth and remove one-shot machinery
        run: |
          python3 scripts/apply-per-output-layer-shell.py truth "${{ steps.implementation.outputs.sha }}"
          python3 - <<'PY'
          from pathlib import Path
          path = Path("TRUTH.md")
          lines = path.read_text(encoding="utf-8").splitlines()
          path.write_text("\n".join(line.rstrip() for line in lines) + "\n", encoding="utf-8")
          PY
          ! grep -R -n -E 'SLOPOS-II|SLOPOS-kernel|SLOPOS kernel|custom kernel' README.md AGENTS.md TRUTH.md
          git rm scripts/apply-per-output-layer-shell.py
          git rm .github/workflows/apply-per-output-layer-shell.yml
          git add TRUTH.md
          git diff --check --cached
          git commit -m "docs: record per-output layer-shell milestone"

      - name: Push verified commits
        run: git push origin HEAD:docs/program-design
