name: Apply output-aware compositor

on:
  push:
    branches:
      - docs/program-design
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: apply-output-aware-compositor
  cancel-in-progress: false

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: docs/program-design
          fetch-depth: 0

      - name: Confirm current branch head
        run: |
          git fetch origin docs/program-design
          test "$(git rev-parse HEAD)" = "$(git rev-parse origin/docs/program-design)"

      - name: Install compositor dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential pkg-config wayland-utils \
            libwayland-dev libwayland-egl-backend-dev \
            libvulkan-dev libegl1-mesa-dev libgles2-mesa-dev \
            libxkbcommon-dev libdbus-1-dev \
            libfontconfig-dev libfreetype6-dev \
            libdrm-dev libgbm-dev \
            libxcb1-dev libxcb-icccm4-dev libxcb-keysyms1-dev \
            libxcb-randr0-dev libxcb-util0-dev libxcb-xfixes0-dev \
            libinput-dev libudev-dev libseat-dev libsystemd-dev

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: output-aware-compositor

      - name: Remove over-broad migration assertion
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path("scripts/apply-output-aware-compositor.py")
          text = path.read_text(encoding="utf-8")
          old = '''    if "self.output_area()" in main or "self.work_area()" in main:
                  raise RuntimeError("legacy whole-canvas presentation helper remains in main.rs")
          '''
          if old not in text:
              raise SystemExit("expected migration assertion was not found")
          path.write_text(text.replace(old, "", 1), encoding="utf-8")
          PY

      - name: Apply guarded implementation
        run: python3 scripts/apply-output-aware-compositor.py apply

      - name: Reject legacy whole-canvas presentation definitions
        run: |
          ! grep -q 'fn output_area(&self)' crates/slopos-compositor/src/main.rs
          ! grep -q 'fn work_area(&self)' crates/slopos-compositor/src/main.rs
          ! grep -q '"nested-0"' crates/slopos-compositor/src/main.rs

      - name: Format and regenerate lockfile
        run: |
          cargo fmt --all
          cargo generate-lockfile
          git diff --check

      - name: Build and test compositor
        run: |
          cargo check -p slopos-compositor --all-targets --locked
          cargo test -p slopos-compositor --all-targets --locked
          cargo clippy -p slopos-compositor --all-targets --locked

      - name: Commit implementation
        id: implementation
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add Cargo.lock \
            crates/slopos-compositor/src/lib.rs \
            crates/slopos-compositor/src/main.rs \
            crates/slopos-compositor/src/output_assignment.rs
          git commit -m "fix(compositor): make presentation output-aware"
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Run exact-commit compositor gates
        run: |
          test -z "$(git status --porcelain --untracked-files=no)"
          bash scripts/verify-compositor-completion.sh
          bash scripts/verify-compositor-headless-runtime.sh

      - name: Record verified truth and remove one-shot machinery
        run: |
          python3 scripts/apply-output-aware-compositor.py truth "${{ steps.implementation.outputs.sha }}"
          ! grep -R -n -E 'SLOPOS-II|SLOPOS-kernel|SLOPOS kernel|custom kernel' README.md AGENTS.md TRUTH.md
          git rm scripts/apply-output-aware-compositor.py
          git rm .github/workflows/apply-output-aware-compositor.yml
          git add TRUTH.md
          git diff --check --cached
          git commit -m "docs: record output-aware compositor milestone"

      - name: Push verified commits
        run: git push origin HEAD:docs/program-design
