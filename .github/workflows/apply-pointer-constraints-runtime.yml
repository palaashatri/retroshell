name: Apply pointer constraints runtime support

on:
  push:
    branches:
      - docs/program-design
    paths:
      - .github/workflows/apply-pointer-constraints-runtime.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: apply-pointer-constraints-runtime
  cancel-in-progress: true

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact branch head without marketplace actions
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git init .
          git remote add origin "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git fetch --no-tags --prune --depth=1 origin "${GITHUB_SHA}"
          git checkout --detach FETCH_HEAD

      - name: Confirm exact trigger is still branch head
        run: |
          test "$(git rev-parse HEAD)" = "${{ github.sha }}"
          git fetch origin docs/program-design
          test "$(git rev-parse origin/docs/program-design)" = "${{ github.sha }}"

      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential pkg-config wayland-utils \
            libwayland-dev libwayland-egl-backend-dev \
            libvulkan-dev libegl1-mesa-dev libgles2-mesa-dev \
            libxkbcommon-dev libdbus-1-dev \
            libfontconfig-dev libfreetype6-dev \
            libdrm-dev libgbm-dev \
            libxcb1-dev libxcb-icccm4-dev libxcb-keysyms1-dev \
            libxcb-randr0-dev libxcb-util0-dev libxcb-xfixes0-dev \
            libinput-dev libudev-dev libseat-dev libsystemd-dev \
            libpipewire-0.3-dev libspa-0.2-dev

      - name: Install pinned Rust toolchain components
        run: |
          rustup toolchain install stable --profile minimal --component clippy,rustfmt
          rustup default stable
          rustc --version
          cargo --version

      - name: Apply guarded implementation
        run: python3 scripts/apply-pointer-constraints-runtime.py

      - name: Format and check patch
        run: |
          chmod +x scripts/verify-compositor-headless-runtime.sh
          cargo fmt --all
          git diff --check

      - name: Build, test and lint workspace
        run: |
          cargo build --workspace --all-targets --locked
          cargo test --workspace --locked
          cargo clippy --workspace --all-targets --locked

      - name: Commit implementation
        id: implementation
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add \
            crates/slopos-compositor/src/lib.rs \
            crates/slopos-compositor/src/main.rs \
            crates/slopos-compositor/src/session_drm.rs \
            crates/slopos-compositor/src/pointer_policy.rs \
            crates/slopos-compositor/examples/headless_pointer_constraints_client.rs \
            scripts/verify-compositor-headless-runtime.sh
          git diff --cached --check
          git commit -m "feat(compositor): enforce pointer constraints"
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Run exact-commit compositor gates
        run: |
          test -z "$(git status --porcelain --untracked-files=no)"
          bash scripts/verify-compositor-completion.sh
          bash scripts/verify-compositor-headless-runtime.sh
          bash scripts/verify-compositor-output-topology-runtime.sh

      - name: Record verified truth and remove one-shot machinery
        env:
          IMPLEMENTATION_SHA: ${{ steps.implementation.outputs.sha }}
          WORKFLOW_RUN: ${{ github.run_id }}
        run: |
          python3 - <<'PY'
          import os
          import re
          from pathlib import Path

          path = Path("TRUTH.md")
          text = path.read_text(encoding="utf-8")
          sha = os.environ["IMPLEMENTATION_SHA"]
          run = os.environ["WORKFLOW_RUN"]
          if not re.fullmatch(r"[0-9a-f]{40}", sha):
              raise SystemExit("invalid implementation SHA")

          text, count = re.subn(
              r"(\*\*Audited product implementation:\*\*\n)`[0-9a-f]{40}`",
              rf"\1`{sha}`",
              text,
              count=1,
          )
          if count != 1:
              raise SystemExit("audited implementation SHA anchor mismatch")

          marker = "\n---\n\n## 3. Production scoring model\n"
          if text.count(marker) != 1:
              raise SystemExit("section 3 marker mismatch")
          wave = f'''\n### Current implementation wave — pointer constraints\n\nImplementation commit `{sha}` is **BUILD VERIFIED** and **TEST VERIFIED**.\nProtocol advertisement plus lock/confine request-destroy lifecycle are\n**RUNTIME OBSERVED** by dedicated GitHub Actions run `{run}` through the\npermanent SLOPOS-owned headless runtime gate. Physical pointer enforcement is\nnot claimed because that gate has no input hardware.\n\nThis wave:\n\n- advertises `zwp_pointer_constraints_v1` from nested and DRM compositor states;\n- activates client lock/confine constraints only while the requested surface has\n  pointer focus and the pointer is inside the optional committed region;\n- keeps `zwp_relative_pointer_v1` delivery active while a locked pointer remains\n  stationary;\n- enforces lock and confinement for nested X11 absolute samples and DRM/libinput\n  relative or absolute motion;\n- preserves accelerated and raw libinput deltas for relative-pointer clients;\n- treats the compositor's session lock as higher priority than application\n  pointer constraints;\n- tests backend-independent free, locked and per-axis confined motion policy; and\n- extends the permanent headless gate to exercise persistent lock and confinement\n  object creation, commit and destruction on the exact compositor build.\n\nThe protocol-defined cursor-position hint remains intentionally non-warping: the\nspecification permits a compositor to ignore this hint, and SLOPOS does not\nfabricate a host-pointer warp on the nested backend.\n\nThe overall product score remains **63/100**. The strict compositor score\nadvances from 71 to **72/100**, with Input correctness advancing from 8 to\n**9/10**. Physical multi-device input, touch, gestures and hotplug remain open.\n'''
          text = text.replace(marker, wave + marker, 1)

          replacements = {
              "| Compositor strict completion | **71** |": "| Compositor strict completion | **72** |",
              "| Input correctness | 8 | 10 | Physical multi-device, touch, gestures, pointer constraints and hotplug |":
                  "| Input correctness | 9 | 10 | Physical multi-device, touch, gestures and hotplug |",
              "| **Total** | **71** | **100** | First subsystem targeted for a genuine 100 |":
                  "| **Total** | **72** | **100** | First subsystem targeted for a genuine 100 |",
          }
          for old, new in replacements.items():
              if text.count(old) != 1:
                  raise SystemExit(f"TRUTH replacement anchor mismatch: {old}")
              text = text.replace(old, new, 1)

          path.write_text("\n".join(line.rstrip() for line in text.splitlines()) + "\n", encoding="utf-8")
          PY

          ! grep -R -n -E 'SLOPOS-II|SLOPOS-kernel|SLOPOS kernel|custom kernel' README.md AGENTS.md TRUTH.md
          git rm scripts/apply-pointer-constraints-runtime.py .github/workflows/apply-pointer-constraints-runtime.yml
          git add TRUTH.md
          git diff --cached --check
          git commit -m "docs: record pointer constraints milestone"

      - name: Push verified commits
        run: |
          git fetch origin docs/program-design
          remote_head="$(git rev-parse origin/docs/program-design)"
          if [ "$remote_head" != "${{ github.sha }}" ]; then
            printf 'branch advanced during exact-commit verification: expected %s, found %s\n' \
              "${{ github.sha }}" "$remote_head" >&2
            exit 1
          fi
          git push origin HEAD:docs/program-design
