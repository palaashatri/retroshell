name: Apply relative pointer runtime support

on:
  push:
    branches:
      - docs/program-design
    paths:
      - .github/workflows/apply-relative-pointer-runtime.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: apply-relative-pointer-runtime
  cancel-in-progress: true

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact branch head without marketplace actions
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git init .
          git remote add origin "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git fetch --no-tags --prune --depth=1 origin "${GITHUB_SHA}"
          git checkout --detach FETCH_HEAD

      - name: Confirm exact trigger is still branch head
        run: |
          test "$(git rev-parse HEAD)" = "${{ github.sha }}"
          git fetch origin docs/program-design
          test "$(git rev-parse origin/docs/program-design)" = "${{ github.sha }}"

      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential pkg-config wayland-utils \
            libwayland-dev libwayland-egl-backend-dev \
            libvulkan-dev libegl1-mesa-dev libgles2-mesa-dev \
            libxkbcommon-dev libdbus-1-dev \
            libfontconfig-dev libfreetype6-dev \
            libdrm-dev libgbm-dev \
            libxcb1-dev libxcb-icccm4-dev libxcb-keysyms1-dev \
            libxcb-randr0-dev libxcb-util0-dev libxcb-xfixes0-dev \
            libinput-dev libudev-dev libseat-dev libsystemd-dev \
            libpipewire-0.3-dev libspa-0.2-dev

      - name: Install pinned Rust toolchain components
        run: |
          rustup toolchain install stable --profile minimal --component clippy,rustfmt
          rustup default stable
          rustc --version
          cargo --version

      - name: Apply guarded implementation
        run: python3 scripts/apply-relative-pointer-runtime.py

      - name: Format and check patch
        run: |
          cargo fmt --all
          git diff --check

      - name: Build, test and lint workspace
        run: |
          cargo build --workspace --all-targets --locked
          cargo test --workspace --locked
          cargo clippy --workspace --all-targets --locked

      - name: Commit implementation
        id: implementation
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add \
            crates/slopos-compositor/src/main.rs \
            crates/slopos-compositor/src/session_drm.rs \
            scripts/verify-compositor-headless-runtime.sh
          git diff --cached --check
          git commit -m "feat(compositor): wire relative pointer protocol"
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Run exact-commit compositor gates
        run: |
          test -z "$(git status --porcelain --untracked-files=no)"
          bash scripts/verify-compositor-completion.sh
          bash scripts/verify-compositor-headless-runtime.sh
          bash scripts/verify-compositor-output-topology-runtime.sh

      - name: Record verified truth and remove one-shot machinery
        env:
          IMPLEMENTATION_SHA: ${{ steps.implementation.outputs.sha }}
          WORKFLOW_RUN: ${{ github.run_id }}
        run: |
          python3 - <<'PY'
          import os
          import re
          from pathlib import Path

          path = Path("TRUTH.md")
          text = path.read_text(encoding="utf-8")
          sha = os.environ["IMPLEMENTATION_SHA"]
          run = os.environ["WORKFLOW_RUN"]
          if not re.fullmatch(r"[0-9a-f]{40}", sha):
              raise SystemExit("invalid implementation SHA")

          text, count = re.subn(
              r"(\*\*Audited product implementation:\*\*\n)`[0-9a-f]{40}`",
              rf"\1`{sha}`",
              text,
              count=1,
          )
          if count != 1:
              raise SystemExit("audited implementation SHA anchor mismatch")
          text = text.replace("**Audit date:** 2026-08-06", "**Audit date:** 2026-08-07", 1)

          marker = "\n---\n\n## 3. Production scoring model\n"
          if text.count(marker) != 1:
              raise SystemExit("section 3 marker mismatch")
          wave = f'''\n### Current implementation wave — relative pointer protocol\n\nImplementation commit `{sha}` is **BUILD VERIFIED** and **TEST VERIFIED**.\nProtocol availability is **RUNTIME OBSERVED** by dedicated GitHub Actions run\n`{run}` through the permanent SLOPOS-owned headless registry gate. This does not\nclaim physical mouse, touchpad or raw-input hardware verification.\n\nThis wave:\n\n- advertises `zwp_relative_pointer_manager_v1` from both the nested and DRM\n  compositor states through Smithay's relative-pointer implementation;\n- forwards relative motion on the DRM/libinput path with both accelerated and\n  unaccelerated device deltas;\n- keeps ordinary `wl_pointer` absolute focus/motion delivery in parallel;\n- derives relative deltas from consecutive absolute samples on the nested X11\n  backend, explicitly using the same value for unaccelerated motion because that\n  backend does not expose raw deltas;\n- keeps the protocol manager alive for the compositor lifetime; and\n- extends the permanent headless runtime gate so CI fails if the relative-pointer\n  global disappears.\n\nThe overall product score remains **63/100**. The compositor score advances from\n70 to **71/100**, with Input correctness advancing from 7 to **8/10**. Pointer\nconstraints, physical multi-device/input evidence, touch, gesture delivery and\ndevice hotplug remain open.\n'''
          text = text.replace(marker, wave + marker, 1)

          replacements = {
              "| Compositor strict completion | **70** |": "| Compositor strict completion | **71** |",
              "| Input correctness | 7 | 10 | Physical multi-device, touch, gestures, constraints, relative pointer and hotplug |":
                  "| Input correctness | 8 | 10 | Physical multi-device, touch, gestures, pointer constraints and hotplug |",
              "| **Total** | **70** | **100** | First subsystem targeted for a genuine 100 |":
                  "| **Total** | **71** | **100** | First subsystem targeted for a genuine 100 |",
          }
          for old, new in replacements.items():
              if text.count(old) != 1:
                  raise SystemExit(f"TRUTH replacement anchor mismatch: {old}")
              text = text.replace(old, new, 1)

          path.write_text("\n".join(line.rstrip() for line in text.splitlines()) + "\n", encoding="utf-8")
          PY

          ! grep -R -n -E 'SLOPOS-II|SLOPOS-kernel|SLOPOS kernel|custom kernel' README.md AGENTS.md TRUTH.md
          git rm scripts/apply-relative-pointer-runtime.py .github/workflows/apply-relative-pointer-runtime.yml
          git add TRUTH.md
          git diff --cached --check
          git commit -m "docs: record relative pointer runtime milestone"

      - name: Push verified commits
        run: |
          git fetch origin docs/program-design
          remote_head="$(git rev-parse origin/docs/program-design)"
          if [ "$remote_head" != "${{ github.sha }}" ]; then
            printf 'branch advanced during exact-commit verification: expected %s, found %s\n' \
              "${{ github.sha }}" "$remote_head" >&2
            exit 1
          fi
          git push origin HEAD:docs/program-design
