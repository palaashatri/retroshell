name: Apply SLOPOS portability contract

on:
  push:
    branches:
      - docs/program-design
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: apply-slopos-portability-contract
  cancel-in-progress: false

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: docs/program-design
          fetch-depth: 0

      - name: Apply guarded AGENTS migration
        run: python3 scripts/apply-slopos-generations-portability.py

      - name: Validate the sole normative document change
        run: |
          git diff --check
          test -n "$(git status --porcelain -- AGENTS.md)"
          git diff --exit-code -- README.md TRUTH.md Cargo.toml Cargo.lock

      - name: Commit and remove one-shot machinery
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add AGENTS.md
          git rm scripts/apply-slopos-generations-portability.py
          git rm .github/workflows/apply-agents-portability.yml
          git commit -m "docs: define SLOPOS generations and POSIX portability"
          git fetch origin docs/program-design
          git rebase origin/docs/program-design
          git push origin HEAD:docs/program-design
